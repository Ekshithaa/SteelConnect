{% extends "base.html" %}
{% block title %}Log in | SteelConnect{% endblock %}
{% block content %}
<section class="auth-layout"><div class="auth-card"><p class="eyebrow">Welcome back</p><h1>Log in to SteelConnect</h1><p>Access your account and manage your steel operations.</p><form method="post" class="form-grid"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Email address<input type="email" name="email" autocomplete="email" required></label><label>Password<input type="password" name="password" autocomplete="current-password" required></label><button class="primary-action" type="submit">Log in securely</button></form><p class="form-note">New to SteelConnect? <a href="{{ url_for('register') }}">Create your account</a>.</p></div></section>
{% endblock %}
