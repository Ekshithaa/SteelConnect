{% extends "admin_base.html" %}
{% block title %}Add product | SteelConnect{% endblock %}
{% block admin_content %}<section class="form-page"><a class="back-link" href="{{ url_for('admin') }}">← Dashboard</a><h1>Add inventory product</h1><p>Create a product customers can browse and order.</p><form class="form-card" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Product name<input name="product" required></label><label>Category<select name="category"><option>Long Products</option><option>Flat Products</option><option>Pipes &amp; Tubes</option><option>Structural Steel</option><option>Other</option></select></label><label>Description<textarea name="description" rows="3" placeholder="Short description shown on the product card"></textarea></label><div class="form-grid"><label>Stock (tons)<input name="stock" type="number" min="0" required></label><label>Price per ton (₹)<input name="price" type="number" min="1" required></label></div><button class="primary-action" type="submit">Add product</button></form></section>{% endblock %}
