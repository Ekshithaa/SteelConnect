{% extends "admin_base.html" %}
{% block title %}Edit product | SteelConnect{% endblock %}
{% block admin_content %}<section class="form-page"><a class="back-link" href="{{ url_for('admin') }}">← Dashboard</a><h1>Edit {{ product.name }}</h1><p>Update the live catalogue and inventory information.</p><form class="form-card" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Product name<input name="product" value="{{ product.name }}" required></label><label>Category<select name="category">{% for category in ['Long Products', 'Flat Products', 'Pipes & Tubes', 'Structural Steel', 'Other'] %}<option {{ 'selected' if product.category == category }}>{{ category }}</option>{% endfor %}</select></label><label>Description<textarea name="description" rows="3">{{ product.description }}</textarea></label><div class="form-grid"><label>Stock (tons)<input name="stock" type="number" min="0" value="{{ product.stock }}" required></label><label>Price per ton (₹)<input name="price" type="number" min="1" value="{{ product.price }}" required></label></div><button class="primary-action" type="submit">Save changes</button></form></section>{% endblock %}
